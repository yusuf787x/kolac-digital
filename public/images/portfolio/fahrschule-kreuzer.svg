<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Fahrschule Kreuzer Bielefeld-Brackwede — Webseite von Kolac Digital">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#dae7f6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g transform="translate(80,60)">
    <rect x="0" y="0" width="640" height="380" rx="18" fill="url(#card)" stroke="#dfe6ef" stroke-width="1"/>
    <circle cx="24" cy="24" r="6" fill="#f27272"/>
    <circle cx="46" cy="24" r="6" fill="#f2c667"/>
    <circle cx="68" cy="24" r="6" fill="#7cc98a"/>
    <line x1="0" y1="52" x2="640" y2="52" stroke="#e6ecf2" stroke-width="1"/>
    <text x="32" y="120" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0071e3">FAHRSCHULE KREUZER</text>
    <text x="32" y="160" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" fill="#1d1d1f">Dein Führerschein in Bielefeld.</text>
    <text x="32" y="196" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" fill="#1d1d1f">In Ruhe. Mit Erfahrung.</text>
    <text x="32" y="234" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6e6e73">Klasse B, BE und B96. Bielefeld-Brackwede und OWL.</text>
    <rect x="32" y="260" width="150" height="42" rx="21" fill="#0071e3"/>
    <text x="107" y="286" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Jetzt anmelden</text>
    <rect x="192" y="260" width="120" height="42" rx="21" fill="#ffffff" stroke="#0071e3" stroke-width="2"/>
    <text x="252" y="286" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0071e3">Anrufen</text>
    <text x="32" y="348" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#86868b">Webseite gebaut von Kolac Digital · Platzhalter, echter Screenshot folgt</text>
