<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 160 100">
  <defs>
    <filter id="dashShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card body -->
  <rect x="0" y="0" width="160" height="100" rx="18" ry="18" fill="#ffffff" stroke="rgba(0,0,0,0.07)" stroke-width="1" filter="url(#dashShadow)"/>
  <!-- Header text: GOOGLE ADS -->
  <text x="12" y="22" font-family="Inter, -apple-system, sans-serif" font-size="7" font-weight="500" fill="#6e6e73" letter-spacing="1" text-transform="uppercase">GOOGLE ADS</text>
  <!-- Metric value -->
  <text x="12" y="38" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1d1d1f">2.847</text>
  <text x="58" y="38" font-family="Inter, -apple-system, sans-serif" font-size="7" font-weight="500" fill="#28c840">+12.4%</text>
  <!-- Bar chart -->
  <!-- Bar 1 - 40% -->
  <rect x="12" y="62" width="20" height="26" rx="2" ry="2" fill="rgba(0,113,227,0.5)"/>
  <!-- Bar 2 - 65% -->
  <rect x="38" y="46" width="20" height="42" rx="2" ry="2" fill="rgba(0,113,227,0.5)"/>
  <!-- Bar 3 - 50% -->
  <rect x="64" y="56" width="20" height="32" rx="2" ry="2" fill="rgba(0,113,227,0.5)"/>
  <!-- Bar 4 - 80% -->
  <rect x="90" y="36" width="20" height="52" rx="2" ry="2" fill="rgba(0,113,227,0.5)"/>
  <!-- Bar 5 - 95% (highlight) -->
  <rect x="116" y="24" width="20" height="64" rx="2" ry="2" fill="rgba(0,113,227,0.8)"/>
  <!-- X-axis labels -->
  <text x="16" y="96" font-family="Inter, sans-serif" font-size="5" fill="#86868b">Mo</text>
  <text x="44" y="96" font-family="Inter, sans-serif" font-size="5" fill="#86868b">Di</text>
  <text x="70" y="96" font-family="Inter, sans-serif" font-size="5" fill="#86868b">Mi</text>
  <text x="95" y="96" font-family="Inter, sans-serif" font-size="5" fill="#86868b">Do</text>
  <text x="122" y="96" font-family="Inter, sans-serif" font-size="5" fill="#86868b">Fr</text>
</svg>
