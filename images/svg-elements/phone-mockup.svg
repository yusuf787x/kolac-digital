<svg xmlns="http://www.w3.org/2000/svg" width="140" height="280" viewBox="0 0 140 280">
  <defs>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f5"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8edf8"/>
      <stop offset="50%" stop-color="#d0dbf5"/>
      <stop offset="100%" stop-color="#c8d6f8"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,113,227,0.1)"/>
    </linearGradient>
    <filter id="phoneShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Phone body -->
  <rect x="0" y="0" width="140" height="280" rx="24" ry="24" fill="url(#phoneBody)" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#phoneShadow)"/>
  <!-- Notch -->
  <rect x="45" y="8" width="50" height="6" rx="3" ry="3" fill="#d1d1d6"/>
  <!-- Screen -->
  <rect x="6" y="20" width="128" height="254" rx="16" ry="16" fill="url(#phoneScreen)"/>
  <!-- Screen bottom glow -->
  <rect x="6" y="234" width="128" height="40" rx="0" ry="0" fill="url(#screenGlow)" clip-path="inset(0 0 0 0 round 0 0 16px 16px)"/>
  <!-- Content lines on screen -->
  <rect x="16" y="40" width="70" height="4" rx="2" fill="rgba(0,113,227,0.2)"/>
  <rect x="16" y="52" width="100" height="4" rx="2" fill="rgba(0,0,0,0.06)"/>
  <rect x="16" y="64" width="55" height="4" rx="2" fill="rgba(0,0,0,0.06)"/>
  <!-- Fake image block -->
  <rect x="16" y="82" width="108" height="60" rx="8" fill="rgba(0,113,227,0.08)"/>
  <!-- More content lines -->
  <rect x="16" y="156" width="90" height="4" rx="2" fill="rgba(0,0,0,0.06)"/>
  <rect x="16" y="168" width="108" height="4" rx="2" fill="rgba(0,0,0,0.06)"/>
  <rect x="16" y="180" width="65" height="4" rx="2" fill="rgba(0,0,0,0.06)"/>
  <!-- Bottom nav dots -->
  <circle cx="50" cy="256" r="3" fill="rgba(0,113,227,0.3)"/>
  <circle cx="65" cy="256" r="3" fill="rgba(0,113,227,0.15)"/>
  <circle cx="80" cy="256" r="3" fill="rgba(0,113,227,0.15)"/>
</svg>
