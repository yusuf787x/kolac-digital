<svg xmlns="http://www.w3.org/2000/svg" width="260" height="180" viewBox="0 0 260 180">
  <defs>
    <filter id="browserShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <!-- Browser body -->
  <rect x="0" y="0" width="260" height="180" rx="18" ry="18" fill="#ffffff" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#browserShadow)"/>
  <!-- Title bar background -->
  <rect x="0" y="0" width="260" height="28" rx="18" ry="18" fill="#f5f5f7"/>
  <rect x="0" y="14" width="260" height="14" fill="#f5f5f7"/>
  <!-- Title bar bottom border -->
  <line x1="0" y1="28" x2="260" y2="28" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
  <!-- Traffic light dots -->
  <circle cx="14" cy="14" r="3" fill="#ff5f57"/>
  <circle cx="26" cy="14" r="3" fill="#ffbd2e"/>
  <circle cx="38" cy="14" r="3" fill="#28c840"/>
  <!-- URL bar -->
  <rect x="56" y="8" width="148" height="12" rx="4" fill="rgba(0,0,0,0.04)"/>
  <rect x="62" y="12" width="60" height="4" rx="2" fill="rgba(0,0,0,0.08)"/>
  <!-- Content area -->
  <!-- Blue headline line -->
  <rect x="14" y="42" width="139" height="6" rx="3" fill="rgba(0,113,227,0.18)"/>
  <!-- Text lines -->
  <rect x="14" y="56" width="186" height="6" rx="3" fill="rgba(0,0,0,0.07)"/>
  <rect x="14" y="70" width="104" height="6" rx="3" fill="rgba(0,0,0,0.07)"/>
  <rect x="14" y="84" width="163" height="6" rx="3" fill="rgba(0,0,0,0.07)"/>
  <!-- Image placeholder -->
  <rect x="14" y="100" width="232" height="50" rx="8" fill="rgba(0,113,227,0.06)"/>
  <!-- Blue accent button -->
  <rect x="14" y="160" width="60" height="12" rx="6" fill="rgba(0,113,227,0.15)"/>
  <rect x="84" y="160" width="40" height="12" rx="6" fill="rgba(0,0,0,0.04)"/>
</svg>
